


<mat-toolbar class="navbar">
  <div class="brand" routerLink="/">
    <mat-icon>payments</mat-icon>
    <span>MTS Payment App</span>
  </div>

  <div class="spacer"></div>

  <nav class="nav-links">
    <button mat-button routerLink="/">Home</button>
    <button mat-button routerLink="/auth" *ngIf="!isLoggedIn()">Login</button>
    <button mat-button routerLink="/admin-login" *ngIf="!isLoggedIn()" class="admin-btn">Admin</button>
    <button mat-button routerLink="/admin-dashboard" *ngIf="isLoggedIn() && isAdmin()" class="admin-btn">Admin
      Dashboard</button>
    <button mat-button routerLink="/dashboard" *ngIf="isLoggedIn() && !isAdmin()">Dashboard</button>
<button
  mat-button
  routerLink="/rewards"
  class="rewards-btn"
  matBadgeColor="accent"
  matBadge={{unscratchedRewardsCount}}
  [matBadgeHidden]="unscratchedRewardsCount === 0"
>
  <mat-icon>card_giftcard</mat-icon>
  Rewards
</button>

    <!-- Avatar Menu - Only show when logged in -->
    <ng-container *ngIf="isLoggedIn()">
      <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="avatar-btn">
        <div class="avatar">
          {{ userInitial }}
        </div>
      </button>

      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          Profile
        </button>

        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          Logout
        </button>
      </mat-menu>
    </ng-container>
  </nav>
</mat-toolbar>
