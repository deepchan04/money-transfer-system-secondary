<mat-toolbar class="navbar">
  <div class="brand" [routerLink]="user ? '/dashboard' : '/'">
    <mat-icon>payments</mat-icon>
    <span>MTS</span>
  </div>

  <div class="spacer"></div>

  <nav class="nav-links">
    <button mat-button routerLink="/auth" *ngIf="!user" [queryParams]="{ mode: 'login' }">Login</button>
    <button mat-button routerLink="/auth" *ngIf="!user" [queryParams]="{ mode: 'signup' }">Sign Up</button>
    <button mat-button routerLink="/admin-login" *ngIf="!user" class="admin-btn">Admin</button>
    <button mat-button routerLink="/admin-dashboard" *ngIf="user && isAdmin() && currentUrl !== '/admin-dashboard'" class="admin-btn">Admin
      Dashboard</button>
    <button mat-button routerLink="/dashboard" *ngIf="user && !isAdmin() && currentUrl !== '/dashboard'">Dashboard</button>
    <button
      mat-button
      routerLink="/rewards"
      *ngIf="user && !isAdmin() && currentUrl === '/dashboard' && isAccountActive && bankAccountLinked"
      class="rewards-btn"
      matBadgeColor="accent"
      matBadge={{unscratchedRewardsCount}}
      [matBadgeHidden]="unscratchedRewardsCount === 0"
    >
      <mat-icon>card_giftcard</mat-icon>
      Rewards
    </button>

    <!-- Avatar Menu - Only show when logged in -->
    <ng-container *ngIf="user">
      <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="avatar-btn">
        <div class="avatar">
          {{ userInitial }}
        </div>
      </button>

      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item routerLink="/profile" *ngIf="!isAdmin()">
          <mat-icon>person</mat-icon>
          Profile
        </button>

        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          Logout
        </button>
      </mat-menu>
    </ng-container>
  </nav>
</mat-toolbar>
