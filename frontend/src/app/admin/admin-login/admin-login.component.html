<button mat-button (click)="goHome()" class="go-back">
  Back to Home
</button>
<mat-card class="auth-card">
  
  <h2>Admin Login</h2>
  <p class="admin-subtitle">Administrative Access Only</p>

  <div *ngIf="errorMessage" class="error-box">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="login()">
    <mat-form-field appearance="outline">
      <mat-label>Phone Number</mat-label>
      <input 
        matInput 
        type="tel" 
        [(ngModel)]="phoneNumber" 
        name="phoneNumber"
        placeholder="Enter 10-digit phone number"
        maxlength="10"
        required
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input 
        matInput 
        [type]="showPassword ? 'text' : 'password'" 
        [(ngModel)]="password" 
        name="password"
        placeholder="Enter password"
        minlength="6"
        required
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        class="password-toggle"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        (click)="showPassword = !showPassword"
      >
        <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <button 
      mat-raised-button 
      color="warn" 
      type="submit"
      [disabled]="!phoneNumber || !password"
    >
      Admin Login
    </button>
  </form>
</mat-card>
